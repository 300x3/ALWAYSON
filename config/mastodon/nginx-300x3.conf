# ALWAYS ON - nginx front proxy for the local "300X3" Mastodon test deployment.
# Single origin http://localhost:3000 (loopback-only): rails web + streaming.
# No TLS: the stack binds 127.0.0.1 exclusively and RAILS_FORCE_SSL=false is a
# documented loopback-only deviation (see docs/runbooks/mastodon.md).

worker_processes 2;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 80m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream mastodon_web   { server 300x3-web:3000; }
  upstream mastodon_stream{ server 300x3-streaming:4000; }

  server {
    listen 80;
    server_name localhost;

    # Mastodon streaming API (websockets)
    location /api/v1/streaming {
      proxy_pass http://mastodon_stream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP 127.0.0.1;
    }

    location / {
      proxy_pass http://mastodon_web;
      proxy_http_version 1.1;
      proxy_set_header Host localhost;
      proxy_set_header X-Real-IP 127.0.0.1;
      proxy_set_header X-Forwarded-For 127.0.0.1;
      proxy_set_header X-Forwarded-Proto http;
    }
  }
}
