# Waveshare SX1262 LoRa HAT - DRONE-RADIO drone-side profile
# Distinct from PEOPLE-RADIO: own frequency (917 MHz), own sync word (0x56),
# own key ID, own device identity. 250 kHz / SF7 per §9.2.2.
radio_profile:
  region: US915
  frequency_mhz: 917
  frequency_plan: "US915 hybrid-channel raw LoRa (NOT LoRaWAN)"
  bandwidth_khz: 250
  spreading_factor: 7
  coding_rate: "4/5"
  preamble_length: 8
  tx_power_dbm: 20
  sync_word: 0x56
  packet_framing: "length-prefixed CRC16 frames"
  max_packet_bytes: 222
  encryption_key_id: "drone-radio-key-v1"
  device_identity: "drone-radio-device-v1"
  sx1262_mac: "RECORD_FROM_HARDWARE"
  replay_protection: "monotonic sequence numbers, 24h window"
  ack_policy: "selective-repeat, 3 retries"
  retry_backoff_ms: [500, 1500, 4500]
  airtime_limit_pct: 10
