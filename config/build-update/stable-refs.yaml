# ALWAYS ON — what "released as stable" means for each managed image.
#
# drift-report.py reads this instead of hardcoding the policy in Python, because
# it is a decision that should be reviewed and changed like any other config.
#
# HOW TO READ IT
#   tracked_tag:  the release this host INTENDS to be on. If the pinned digest
#                 does not match this tag, that is a DRIFT and needs a decision.
#   major_series: the major version the host is deliberately held at. When
#                 upstream `latest` has moved past it, the report says
#                 BEHIND LATEST, which is information: promoting would be a MAJOR
#                 version change, not an update.
#   tag_kind:     "release" for a precise version tag (v4.3.7) - missing it means
#                 the host is not on a release it intended to be on.
#                 "rolling" for a moving major/minor tag (17, 7) - the tag is
#                 REBUILT for security patches, so a mismatch means a newer
#                 patch of the SAME major exists. Still actionable, but it is
#                 not a version decision and must not be read as one.
#   null:         the project publishes no declared stable channel, so the
#                 comparison falls back to `latest` and reports BEHIND LATEST.
#                 That is a deliberate "we do not track a release here" answer.
#
# Versions below were read from the RUNNING containers on 2026-10-01, not
# copied from the README. Where a tag could not be confirmed to exist upstream,
# tracked_tag is null rather than guessed.

schema_version: 1

images:

  # --- deliberately held at an older major -------------------------------
  docker.io/library/postgres:
    major_series: "17"
    tracked_tag: "17"
    tag_kind: "rolling"
    running: "PostgreSQL 17.11"
    note: >-
      Deliberately on 17, not 18. `latest` is 18, so this will always report
      BEHIND LATEST. That is correct and must not be "fixed" by promoting: a
      Postgres major bump needs a dump/restore and a compatibility check.

  docker.io/library/redis:
    major_series: "7"
    tracked_tag: "7"
    tag_kind: "rolling"
    running: "Redis 7.4.11"
    note: "Held at major 7."

  # --- tracked release tags ----------------------------------------------
  ghcr.io/mastodon/mastodon:
    tracked_tag: "v4.3.7"
    tag_kind: "release"
    major_series: "4"
    running: "v4.3.7"
    note: "Tracked release. web and sidekiq both sit on it; streaming does not."

  ghcr.io/mastodon/mastodon-streaming:
    tracked_tag: "v4.3.7"
    tag_kind: "release"
    major_series: "4"
    running: "unknown, pinned by digest only"
    held_digest: "sha256:24834e873cc79ae0677c7e5938e575b4367f2c1c6df46376eb7aa937ee467f4b"
    note: >-
      DELIBERATE HOLD, 2026-10-02. The operator asked to leave the Mastodon stack
      alone and to hold streaming where it is rather than verify it now. This
      digest is therefore the accepted state, not a known gap, and the report
      calls it HELD rather than DRIFT. No image and no unit file was changed to
      achieve this - only this record. Revisit when the stack is next verified.

  docker.io/webodm/webodm_webapp:
    tracked_tag: null
    major_series: null
    running: "v3.2.8 per version-matrix"
    note: "No declared stable channel; upstream publishes no versioned tags."

  # --- no declared stable channel ----------------------------------------
  docker.io/grafana/grafana-oss:
    tracked_tag: null
    major_series: null
    running: "unknown from the container"
    note: >-
      Grafana publishes rolling tags, not a stable release line, so there is no
      tracked_tag to compare against. Reported as BEHIND LATEST. Filling this in
      with a real major series would turn that into a meaningful comparison.

  docker.io/metabase/metabase:
    tracked_tag: null
    major_series: null
    running: "unknown from the container"
    note: "Same situation as Grafana: rolling tags only."

  docker.io/prom/prometheus:
    tracked_tag: null
    major_series: "3"
    running: "v3.x"
    note: "Held at major 3. Upstream v3.5.0 exists as a tag."

  docker.io/prom/node-exporter:
    tracked_tag: null
    major_series: null
    running: "unknown"
    note: "Rolling tags only."

  docker.io/library/python:
    tracked_tag: null
    major_series: null
    running: "3.13 base image"
    note: >-
      Python base images are rebuilt on the same tag, so the digest changes
      without a version change. A digest bump here is routine, not a release.

  docker.io/opendronemap/nodeodm:
    tracked_tag: null
    major_series: null
    running: "unknown"
    note: "No declared stable channel."

  docker.io/webodm/webodm_db:
    tracked_tag: null
    major_series: null
    running: "unknown"
    note: "No declared stable channel."

# ---------------------------------------------------------------------------
# OPERATOR DECISIONS - 2026-10-02
# ---------------------------------------------------------------------------
# Recorded verbatim and applied to the tools where the tools can act on them.
# Anything a human must still do is listed as `open` rather than quietly done.
decisions:
  security_updates:
    policy: "ALWAYS INCORPORATE SECURITY UPDATES"
    standing: true
    scope: >-
      Security-pocket apt updates and newer patches of an already-tracked major
      version are incorporated without waiting for a case-by-case decision. This
      is a STANDING instruction, not a one-off. Non-security updates are not
      covered by it and still wait.
    affects: "docs/drift.md SECURITY and TAKE_NOW classes for rolling tags"

  stabilisation_hold:
    policy: "PIN AS-IS AND WAIT"
    standing: true
    scope: >-
      NON-security updates are frozen until the system stabilises and has proven
      operational capability. Applies to the WebODM image rebuild, the two Ubuntu
      -updates pocket packages, and Microsoft Edge.
    standing_review: "Revisit once the platform is judged stable."

  ros:
    policy: "WAIT FOR ROS CLEANUP AND CHECK MORE DOCUMENTATION"
    standing: true
    scope: >-
      Do not attempt to unblock packages.ros.org by weakening TLS. Research the
      certificate fault further before proposing any remedy.

  direct_downloads:
    policy: "OBSIDIAN AND CROSSOVER ARE MINE TO KEEP TRACK OF; FOXGLOVE YOU NEED TO FIGURE OUT AN UPDATE METHOD FOR"
    standing: true
    obsidian: "operator-managed; not our concern"
    crossover: "operator-managed; not our concern"
    foxglove_studio: "OUR RESPONSIBILITY - an update method must be found and built"
    # FINDING 2026-10-02: Foxglove 3.3.0 has no usable update channel.
    #   apt      not in any repository; dpkg-installed from a vendor .deb
    #   snap     not available
    #   flatpak  not packaged
    #   self     /opt/Foxglove has no updater component
    #   feed     no usable public release API was reachable
    # So the ONLY workable method is a periodic version check against the
    # vendor's published version, reporting a difference for a human to act on
    # by re-downloading the .deb. That check is part of the unmanaged-software
    # tracking below, not a separate mechanism.

  unmanaged_software:
    policy: "YOUR JOB IS TO TRACK THESE AS WELL"
    standing: true
    scope: >-
      AppImages, /opt trees and ~/.local/bin executables are now in scope for
      freshness tracking, not merely listed. They were previously reported and
      left alone.

  meshchatx_placement:
    policy: "MESHCHATX SHOULD MOVE TO AO-FIELD"
    standing: true
    rationale: >-
      MeshChatX is a coordination layer for the Reticulum Network Stack (RNS),
      which sits BETWEEN two networks: one for people, which has public
      connections, and a separate one for drones, which is built on private ones.
      RNS manages that split. That is a field-domain responsibility, so it belongs
      on ao-field, not as a bare host process on loopback.
    open: >-
      NOT MOVED. Investigation on 2026-10-02 settles the shape of the problem:
      one RNS stack, not two installations, is the correct answer, and the
      public/private split already exists inside it.
    findings: >-
      ONE stack. ~/.reticulum/config is a single Reticulum stack. MeshChatX reads
      it via --reticulum-config-dir. There are no two installations today, and
      introducing a second would be wrong: Reticulum addresses peers by Routing
      ID within ONE namespace, so a second stack would not see the first's peers
      and MeshChatX could only ever reach one half.
      THE SPLIT ALREADY EXISTS as two RNode interfaces in that one config:
        [[PEOPLE-RADIO]] RNodeInterface, /dev/serial/by-path/...usb-0:13, 915 MHz
                         125 kHz, enabled
        [[DRONE-RADIO]]  RNodeInterface, /dev/serial/by-path/...usb-0:1,  917 MHz
                         250 kHz, enabled
      Both are backed by named udev symlinks (ao-people-radio, ao-drone-radio)
      from config/field/heltec-v3/udev/99-ao-heltec.rules, mode 0660 group dialout,
      with ID_MM_DEVICE_IGNORE=1 so ModemManager cannot steal them.
      Alongside them are roughly thirty TCPClientInterface peers on port 4242 to
      public Reticulum backbones - that is the public half.
    the_real_gap: >-
      No interface_routing_id ranges are configured anywhere in the stack. The
      people/drone separation is therefore enforced only by RADIO FREQUENCY, not
      by ROUTING. RNS can route over any enabled interface, so drone traffic
      could egress over a public TCP backbone and public traffic could egress
      over the drone radio. For a channel the README describes as authenticated
      private drone traffic, that is the actual exposure, and it is a different
      problem from the container placement the operator raised.
    blocking_conflict: >-
      A container on ao-field has neither thing MeshChatX needs: ao-field is
      Internal=true, so there is no public egress, and USB serial devices are not
      passed in by default. Moving it as-is would break the public half AND the
      radios.
    proposed_shape: >-
      Keep ONE RNS stack and ONE MeshChatX installation. Place it in a container
      on ao-field, dual-homed to a dedicated RNS egress network (the existing
      ao-reporting-egress precedent, for Grafana and Metabase), with
      /dev/ao-people-radio and /dev/ao-drone-radio passed in explicitly. Then
      set interface_routing_id ranges so RNS itself enforces the split rather
      than relying on frequency. Requires operator approval: it changes network
      topology, isolation policy, and adds serial device passthrough to a
      container. No change made.

# Image references that are not tracked because no upstream is meaningful.
untracked:
  - pattern: "localhost/*"
    reason: "local build; the owning domain re-pins after a rebuild"
  - pattern: "ghcr.io/ardupilot/ardupilot-sitl"
    reason: >-
      DELIBERATE, 2026-10-02. The operator wants the most recent ArduPilot SITL,
      so this stays on a floating :latest tag ON PURPOSE. It is not a pinning
      defect and must not be reported as one. The unit is also not deployed, so
      nothing runs from it today.

# ---------------------------------------------------------------------------
# ROS is always validated against Ubuntu 26.04 LTS.
# ---------------------------------------------------------------------------
# The operator's rule: ROS packages are checked against the Ubuntu 26.04 LTS
# ("resolute") suite, always. Not against any other suite, and not against
# whatever the ROS repository happens to default to.
#
# The 351 installed ROS packages come from packages.ros.org/ros2/ubuntu, which
# currently serves resolute - that is correct and must stay. The repository is
# nonetheless unreachable from this host because TLS verification fails, so no
# ROS package can be fetched or updated at all. That is a TRANSPORT fault, not a
# suite mismatch, and it is NOT to be worked around by disabling verification.
ros_policy:
  validate_against_suite: "resolute"
  validate_against_release: "26.04"
  expected_origin: "packages.ros.org"
  current_origin: "packages.ros.org/ros2/ubuntu"
  suite_matches: true
  reachable: false
  unreachable_reason: >-
    TLS name mismatch. The certificate presented is CN=*.osuosl.org with
    subjectAltName "DNS:osuosl.org, DNS:*.osuosl.org", which does not include
    packages.ros.org, so verification fails and no HTTP response is returned.
  # DIAGNOSIS 2026-10-02, from openssl s_client and curl -4:
  #   subject   CN=*.osuosl.org, O=Oregon State University
  #   issuer    InCommon Intermediate CA - OVG2C
  #   chain     "Verify return code: 0 (ok)"  <- the CA chain is TRUSTED
  #   validity  notBefore Jul 23 2026, notAfter Feb 7 2027  <- currently VALID
  #   SAN       osuosl.org, *.osuosl.org only
  #   curl      (60) no alternative certificate subject name matches target
  #             hostname 'packages.ros.org'
  #   IPv6      no route on this host; IPv4 is the only usable path
  #
  # CONCLUSION: this is NOT an interception, NOT an expired certificate and NOT
  # an untrusted issuer. The CA chain validates and the certificate is in date.
  # The ONLY fault is that the server does not list packages.ros.org in the
  # certificate it presents for that vhost. That is a server-side
  # misconfiguration at Open Source Logic and cannot be fixed from this host.
  #
  # NOT DONE, DELIBERATELY: pinning that certificate by hand, or disabling
  # verification. Either would trade a name-verification failure for a silent
  # trust failure, which is strictly worse. Waiting for the operator's ROS
  # cleanup and further documentation review, as instructed.
  rule: >-
    Any ROS package whose resolved suite is not "resolute" is a finding in its
    own right, separate from the reachability fault. The inventory checks the
    suite on every ROS package and reports a mismatch separately, so a silent
    move to a different Ubuntu suite cannot hide behind the TLS problem.

# ---------------------------------------------------------------------------
# Provenance for software that no configured repository provides.
# ---------------------------------------------------------------------------
# These are installed but appear in no apt index, so apt will never offer them an
# update. That is expected for direct downloads, and recording why stops them
# being reported as unexplained orphans. It also records the real consequence:
# an update means re-downloading from the vendor by hand.
direct_downloads:
  - package: "obsidian"
    version: "1.13.4"
    source: "vendor .deb from obsidian.md, installed with dpkg"
    update_meaning: "re-download the .deb from the vendor and reinstall"
  - package: "crossover"
    version: "25.1.0-1"
    source: "vendor .deb from codeweavers.com, installed with dpkg"
    update_meaning: "re-download the .deb from the vendor and reinstall"
  - package: "foxglove-studio"
    version: "3.3.0"
    source: "vendor .deb from foxglove.io; /usr/bin/foxglove-studio -> /opt/Foxglove"
    update_meaning: "re-download the .deb from the vendor and reinstall"
    tracked_by_us: true
    update_channel: >-
      NONE. No apt repo, no snap, no flatpak, no self-updater, no usable release
      feed. Tracked by periodic version comparison only.
    note: >-
      Found while attributing provenance on 2026-10-02. Same category as obsidian
      and crossover: installed from a direct vendor download, in no apt index, so
      apt will never offer it an update. Recorded because the operator asked why
      these packages appear as orphans, and this is the same answer.
