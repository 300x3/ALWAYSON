# ALWAYS ON journald retention (README 16.3, work item OPS-26). Staged 2026-10-03.
#
# WHY THIS FILE EXISTS -- MEASURED, NOT ASSUMED:
#   $ grep -nE '^\s*#?\s*(SystemMaxUse|SystemKeepFree|SystemMaxFileSize|MaxRetentionSec)'
#       /etc/systemd/journald.conf
#   27:#SystemMaxUse=
#   28:#SystemKeepFree=
#   29:#SystemMaxFileSize=
#   35:#MaxRetentionSec=0
#   $ journalctl --disk-usage
#   Archived and active journals take up 4G in the file system.
#
# Every size cap in the shipped journald.conf is COMMENTED OUT, so the default
# is SystemMaxUse=10% of the filesystem, and no age cap at all (MaxRetentionSec=0
# means "keep forever"). The host root filesystem is 458G with 127G available
# (measured 2026-10-03), so the implicit ceiling is ~45G of journal -- far more
# than 4G of service output needs, and unbounded in TIME.
#
# The values below are a deliberate tightening on two axes:
#
#   Size  4G  -- generous against the 4G actually in use, so nothing is evicted
#                 on a normal day. It exists to convert an implicit ~45G into an
#                 explicit, predictable number.
#   Age   90d -- this is the real change. MaxRetentionSec=0 keeps journal
#                 entries forever; 90 days bounds the forensic window. Backup
#                 and restore evidence is NOT lost to this: that lives in
#                 /ALWAYSON/logs/ and /ALWAYSON/backups/ on a 400-day budget
#                 (see config/host/logrotate-alwayson.conf), not in journald.
#
# SystemKeepFree=8G is a floor, not a target: under disk pressure journald
# gives space back rather than filling the filesystem. That is the setting that
# actually protects the photogrammetry drive's host filesystem.
#
# RuntimeMaxUse covers the per-user journals under /run, which are RAM-backed
# and vanish on reboot; the cap keeps an unbounded user journal from pressuring
# memory.
#
# INSTALL (needs root; not installed by this session -- see OPS-25):
#   install -m 0644 /ALWAYSON/config/host/journald-alwayson.conf \
#           /etc/systemd/journald.conf.d/60-alwayson-retention.conf
#   systemctl restart systemd-journald
#   journalctl --disk-usage        # verify the cap took effect
#
# This is a drop-in in journald.conf.d/, NOT an edit of /etc/systemd/journald.conf.
# Editing the shipped file is overwritten by package upgrades; a numbered drop-in
# in the 60- range wins over the default and is the supported mechanism.
[Journal]
SystemMaxUse=4G
SystemKeepFree=8G
SystemMaxFileSize=256M
MaxRetentionSec=90day
RuntimeMaxUse=200M
RuntimeKeepFree=100M