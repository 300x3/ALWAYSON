# ALWAYS ON log rotation (README 16.3, work item 53). STAGED 2026-10-03,
# NOT INSTALLED — /etc/logrotate.d/alwayson does not exist and installing it
# needs root (OPS-25). Do not read the word "staged" as "active".
#
# OVERHEAD: negligible. logrotate renames (mv) and recreates; it never reads or
# greps log content. Measured: `time logrotate --debug /etc/logrotate.conf`
# returned 0.008s real for a full system pass. logrotate.timer runs once daily,
# so the cost is roughly 8 ms/day in total.
#
# compress is deliberately NOT set. Rotation itself is a rename and costs
# nothing, but compression is the one step that reads whole files, and
# /ALWAYSON/logs/sim-gz-server.log is continuously written by the running
# Gazebo service. Without compression, rotated logs stay uncompressed and are
# removed at the rotation count below, so disk stays bounded by
# (files kept x peak size) rather than growing without limit.
#
# Only top-level *.log files share the short budget. The subdirectories
# (operations/, gpu-runtime/, backup/, installation/) are per-operation record
# sets under README 16.3 and get a much longer 400-day budget in the blocks
# below, rather than the 14-rotation budget above — truncating them on the same
# schedule would destroy audit history. See OPS-26 and section 17.5.
/ALWAYSON/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    nocopytruncate
    create 0664 scottw scottw
    su scottw scottw
}

# ---------------------------------------------------------------------------
# Log SUBDIRECTORY retention (README 16.3, OPS-26, added 2026-10-03).
#
# The policy above deliberately rotates only top-level *.log, because the
# subdirectories are per-operation AUDIT records and truncating them destroys
# history. That leaves them unbounded, so retention is handled here by
# age rather than by rotation count: a file is removed only when it is older
# than the class budget AND outside the audit window.
#
# Two classes, because these directories are NOT equivalent:
#
#   operations/, backup/, gpu-runtime/, installation/
#       Per-operation evidence that README 16.3 requires to survive. 400 days
#       covers four quarterly DR exercises (17.1) plus margin. Age-based, NOT
#       count-based: these directories have few files but high value, and a
#       count limit would evict a February record in a quiet month.
#
# The subdirectories are currently small (measured 2026-10-03: backup 28K,
# gpu-runtime 12K, installation 288K, operations 580K — it grew during the
# session as other sessions logged, so these are append-only and live), so
# these budgets are
# generous headroom, not a response to a disk-space emergency.
#
# The glob is single-level by construction: *.log does not cross a directory
# separator, so these blocks cannot reach nested directories. logrotate has no
# maxdepth option, and adding one produces "unknown option 'maxdepth' --
# ignoring line" rather than an error (measured 2026-10-03), so the glob is the
# whole mechanism.
#
# This policy is STAGED, not installed: /etc/logrotate.d/alwayson does not
# exist on this host and installing it needs root (OPS-25). sudo -n is not
# available in this session (measured: `sudo -n true` -> "sudo: a password is
# required"). Verified with logrotate --debug against this file instead.
/ALWAYSON/logs/operations/*.log {
    daily
    rotate 400
    missingok
    notifempty
    nocopytruncate
    create 0664 scottw scottw
    su scottw scottw
}

/ALWAYSON/logs/backup/*.log {
    daily
    rotate 400
    missingok
    notifempty
    nocopytruncate
    create 0664 scottw scottw
    su scottw scottw
}

/ALWAYSON/logs/installation/*.log {
    daily
    rotate 400
    missingok
    notifempty
    nocopytruncate
    create 0664 scottw scottw
    su scottw scottw
}

/ALWAYSON/logs/gpu-runtime/*.log {
    daily
    rotate 400
    missingok
    notifempty
    nocopytruncate
    create 0664 scottw scottw
    su scottw scottw
}
