  - id: host-restic
    label: "restic encrypted backup (host)"
    software: "restic — encrypted local snapshots + encrypted pCloud replication"
    schedules: ["nightly restic 03:30", "nightly DB dumps 03:00", "weekly verify"]
    data: "PostgreSQL/Corda-aware encrypted backup; restore test in an isolated location"
    status: implemented
    note: "Local authority + encrypted restic + encrypted pCloud replication. Independent of IPFS and Corda (v6 ES.1)."

  - id: host-kwallet
    label: "KDE Wallet (kwalletd6) — secret authority"
