# ALWAYS ON — declarative system topology model (Section 3.1 supporting input)
# Consumed by /ALWAYSON/scripts/operations/generate-topology.py.
#
# Authority for every entry in this file is /ALWAYSON/README.md.  This file adds
# machine-readable shape for facts that have no Quadlet representation (host
# services, desktop software, field hardware, controlled egress/ingress paths).
# It does not redefine, weaken, or replace the README.
#
# Status vocabulary (README "Document Status and Reading Guide"):
#   implemented | partial | in_progress | planned | blocked
#
# SECRET RULE: no password, token, key, credential path, or secret value may be
# added to this file.  It is rendered into diagrams, HTML, and Grafana panels.

version: 2
revision: "2026-09-29"
# Authority: the v6 architecture document supplied by the operator.  Where the
# older /ALWAYSON/README.md and v6 disagree, v6 governs (v6 ES.1: "replaces any
# contrary older text below").
authority: "/ALWAYSON/TOPOLOGY/ALWAYS ON — Architecture, Operations, and Status - v6.md"
authority_short: "v6"
supersedes: "/ALWAYSON/README.md"
generated_outputs: "/ALWAYSON/TOPOLOGY/"
grafana_dashboard_uid: "ao-topology"
grafana_dashboard_slug: "ao-system-topology"

# ---------------------------------------------------------------------------
# DATABASES AND DATA STORES (v6 Section 3.3 / 3.3.1 — Program-to-Database Map)
#
# Authority legend (v6 3.3):
#   authoritative_relational - PostgreSQL owns detailed operational data,
#                               searchable business records, reporting projections
#   authoritative_ledger     - Corda owns final sale/contract, receipt association,
#                               entitlement, approved state transitions
#   current_migration_state   - container-scoped PostgreSQL still exists while data
#                               is consolidated onto the host cluster; not target
#   target                    - documented end state, not fully deployed
#   blocked                   - needs operator key/certificate/credential
#   active                    - running and verified
#   not_authoritative         - cache, queue, embedded, or filesystem state
#   not_an_application_db     - SQLite/H2 embedded or retained migration data only
#
# SECRET RULE: no password, token, key, or credential may appear here.
# ---------------------------------------------------------------------------
databases:
  - id: db-host-postgres
    label: "Host PostgreSQL 18.6 cluster"
    software: "postgresql-18 18.6 + PostGIS 3.6.2 (host systemd service)"
    kind: postgresql
    placement: host
    listens: ["127.0.0.1:5432", "[::1]:5432", "unix:/var/run/postgresql/.s.PGSQL.5432"]
    authority: authoritative_relational
    status: active
    role: "System-wide relational platform. One cluster, separate logical databases, separate application roles. REVOKE CONNECT FROM PUBLIC enforced."
    logical_dbs: ["salesdb", "mastodon", "webodm", "grafana", "metabase", "cordadb", "postgres"]
    note: "Target end state. Some applications still run container-scoped PostgreSQL during migration."

  - id: db-salesdb
    label: "salesdb"
    software: "PostgreSQL 18 (host cluster target)"
    kind: postgresql
    placement: host
    parent: db-host-postgres
    programs: ["Sales API", "ao-payment (planned)", "Metabase (reporting)"]
    authority: authoritative_relational
    status: current_migration_state
    role: "Authoritative sales/payment records: customers, orders, products, payments, receipts, entitlements, audit history."
    note: "Repository schema defined; live salesdb application schema still requires explicit initialization. Container-scoped sales-db exists today."

  - id: db-mastodon
    label: "mastodon"
    software: "PostgreSQL 18 (in container-scoped mastodon-db today)"
    kind: postgresql
    placement: container
    parent: db-host-postgres
    programs: ["Mastodon web", "Mastodon Sidekiq", "Mastodon streaming"]
    authority: authoritative_relational
    status: current_migration_state
    role: "Mastodon application state: accounts, posts, media metadata, federation state, background-job data."
    note: "CONSOLIDATION INCOMPLETE: container-scoped mastodon-db is running on ao-sales while the documented target is the host cluster."

  - id: db-webodm
    label: "webodm (PostGIS)"
    software: "PostgreSQL/PostGIS (in container-scoped db today)"
    kind: postgis
    placement: container
    parent: db-host-postgres
    programs: ["WebODM webapp", "WebODM worker", "NodeODM", "Metabase (reporting)"]
    authority: authoritative_relational
    status: current_migration_state
    role: "Mapping projects, processing state, users, geospatial data."
    note: "Large image/output artifacts remain filesystem data on /media/scottw/500GBPHOTOGRAM/."

  - id: db-grafana
    label: "grafana"
    software: "PostgreSQL 18 (host cluster)"
    kind: postgresql
    placement: host
    parent: db-host-postgres
    programs: ["Grafana ao-grafana"]
    authority: authoritative_relational
    status: target
    role: "Grafana users, dashboards, folders, datasource definitions, preferences, alert state."
    note: "Not a disposable dashboard: requires backup, restore testing, migrations, health checks."

  - id: db-metabase
    label: "metabase"
    software: "PostgreSQL 18 (host cluster)"
    kind: postgresql
    placement: host
    parent: db-host-postgres
    programs: ["Metabase ao-metabase"]
    authority: authoritative_relational
    status: target
    role: "Metabase users, collections, questions, dashboards, database connections, settings."
    note: "Persistence confirmation and first protected read-only query are open items."

  - id: db-cordadb
    label: "cordadb (Corda persistence)"
    software: "PostgreSQL 18 — separate logical database with its own roles and backup scope"
    kind: postgresql
    placement: host
    parent: db-host-postgres
    programs: ["Corda node ao-ledger-core (planned)"]
    authority: authoritative_ledger
    status: blocked
    role: "Corda persistence. AUTHORITATIVE LEDGER for sale/contract, receipt association, entitlement, approved state transitions."
    note: "Corda 5.2.2 persists in cordadb. Corda 4.14.2 (H2) was retired 2026-09-28; it was a separate legacy scaffold, never a Corda 5 staging target, and held no ledger state. Blocked on operator key/certificate ceremony (v6 18.2/18.3)."

  - id: db-postgres-admin
    label: "postgres (administrative)"
    software: "PostgreSQL 18 (host cluster)"
    kind: postgresql
    placement: host
    parent: db-host-postgres
    programs: ["Maintenance", "backup", "restore validation"]
    authority: authoritative_relational
    status: active
    role: "Administrative/maintenance database for the shared cluster."

  - id: db-host-redis
    label: "Host Redis 8.0.5 (database 0)"
    software: "redis-server 8.0.5 (host systemd service)"
    kind: redis
    placement: host
    listens: ["127.0.0.1:6379"]
    programs: ["general coordination"]
    authority: not_authoritative
    status: active
    role: "General low-latency cache/coordination layer. NOT a system of record; no current application data confirmed."

  - id: db-mastodon-redis
    label: "mastodon-redis (database 0)"
    software: "Redis 8 (container-scoped)"
    kind: redis
    placement: container
    programs: ["Mastodon web", "Mastodon Sidekiq"]
    authority: not_authoritative
    status: active
    role: "Mastodon cache, queues, background-job coordination. Not authoritative business data."

  - id: db-broker
    label: "broker (database 0)"
    software: "Redis 8 (container-scoped)"
    kind: redis
    placement: container
    programs: ["WebODM worker", "WebODM broker"]
    authority: not_authoritative
    status: active
    role: "Celery/task broker and worker coordination. Not authoritative mapping data."

  - id: db-prometheus
    label: "Prometheus TSDB"
    software: "prometheus v3.4.1 — /prometheus persistent volume"
    kind: tsdb
    placement: container
    programs: ["Grafana (metrics datasource)", "alerting", "rule evaluation"]
    authority: not_authoritative
    status: implemented
    role: "Specialized time-series store: metrics, service health, resource usage, operational monitoring. Works without Grafana."
    note: "Grafana visualizes metrics; Prometheus remains the separate metrics store and the alerting layer."

  - id: db-openclaw
    label: "OpenClaw SQLite state"
    software: "SQLite (desktop application state)"
    kind: sqlite
    placement: host
    path: "~/.openclaw/state/openclaw.sqlite"
    programs: ["OpenClaw gateway", "OpenClaw chat relay"]
    authority: not_authoritative
    status: active
    role: "Local operational state. Not part of SQL reporting."

  - id: db-akonadi
    label: "Akonadi / KDE PIM SQLite"
    software: "SQLite (desktop application state)"
    kind: sqlite
    placement: host
    programs: ["Akonadi", "KDE PIM"]
    authority: not_authoritative
    status: active
    role: "Contacts, calendars, mail indexes, local personal-information data."

  - id: db-browsers
    label: "Browser profile SQLite stores"
    software: "SQLite (Konqueror/KDE WebEngine, Firefox, Brave, Chrome, Edge)"
    kind: sqlite
    placement: host
    programs: ["browsers"]
    authority: not_authoritative
    status: active
    role: "History, site storage, caches, certificates, profile data."

  - id: db-podman
    label: "Podman rootless metadata store"
    software: "SQLite (rootless Podman)"
    kind: sqlite
    placement: host
    programs: ["Podman"]
    authority: not_authoritative
    status: active
    role: "Container, image, network, volume metadata. Not application data."

  - id: db-sim-local
    label: "ROS / simulation local SQLite"
    software: "SQLite (application-specific local files)"
    kind: sqlite
    placement: host
    programs: ["ROS 2 Lyrical", "Gazebo Sim", "ArduPilot SITL", "QGroundControl"]
    authority: not_authoritative
    status: active
    role: "Local tool state where enabled. Not a shared reporting source."

  - id: db-filesystem-state
    label: "Filesystem / local application state"
    software: "Application files, logs, project files, local state"
    kind: filesystem
    placement: host
    programs: ["LM Studio", "OpenClaw", "MeshChatX", "QGroundControl", "ArduPilot", "Gazebo", "simulation tools", "restic"]
    authority: not_authoritative
    status: active
    role: "Operational or engineering data that is not automatically part of SQL reporting."

  - id: db-mapping-media
    label: "Photogrammetry media (filesystem, ext4)"
    software: "/media/scottw/500GBPHOTOGRAM/ — ext4 /dev/sdb1, UUID verified"
    kind: filesystem
    placement: host
    programs: ["WebODM", "NodeODM", "imagery intake/exporter"]
    authority: not_authoritative
    status: implemented
    role: "Source imagery, orthophotos, point clouds, 3D model artifacts. Large binaries stay filesystem-resident; only metadata is in webodm."
    note: "Deploy or operate WebODM only after the drive and mount are validated (v6 8.5)."

  - id: db-h2-legacy
    label: "H2 legacy migration backups"
    software: "H2 (retained backup files only)"
    kind: h2
    placement: host
    programs: ["Grafana/Metabase legacy migration"]
    authority: not_an_application_db
    status: not_active
    role: "No longer active; retained temporarily for rollback and migration evidence."
    note: "H2 and SQLite are NOT approved application databases for Grafana or Metabase. Separately, the Corda H2 scaffold is a known defect (see cordadb)."


