# ALWAYS ON - loopback service inventory for automated reachability checks.
#
# WHAT THIS IS FOR
#   scripts/validation/check-local-services.py drives Google Chrome through
#   Playwright and loads every URL below, asserting a real HTTP status and a
#   real content marker. It exists to prove each loopback service is actually
#   reachable AND actually serving its own content, not merely holding a port.
#
# WHY DECLARATIVE
#   The checker cross-checks the "published_by_quadlet" list against the
#   PublishPort= lines in quadlet/*.container. A service that gains or loses a
#   published loopback port must be recorded here, so configuration drift is
#   caught instead of being silently tolerated by a stale expectation.
#
# STATUS SEMANTICS
#   expect_status  Accepted HTTP status codes. A service that legitimately
#                  answers 400 or 404 on "/" lists it here rather than being
#                  special-cased in code.
#   expect_title   Substring that must appear in the rendered <title>.
#   expect_body    Substring that must appear in the rendered body text.
#                  Title alone is weak: a proxy error page can carry the right
#                  title, so each entry asserts something specific.
#   verifiable: false
#                  Correctly NOT reachable over loopback. Reported as
#                  UNVERIFIABLE with a reason. Never counted as a pass, and
#                  never counted as a failure either, because the absence is by
#                  design rather than a fault.
#
# All expect_* values below were recorded by observation on 2026-09-30, not
# assumed. Where a service does not return the asserted field it is set to
# null explicitly, so a missing expectation is a deliberate statement rather
# than a silently skipped check.

meta:
  # Loopback ports published by a Quadlet unit. Cross-checked against
  # PublishPort= so this list cannot drift from the units unnoticed.
  published_by_quadlet:
    - { port: 3000, unit: quadlet/sales/ao-mastodon-web.container }
    - { port: 4000, unit: quadlet/sales/ao-mastodon-streaming.container }
    - { port: 3001, unit: quadlet/operations/ao-grafana.container }
    - { port: 3002, unit: quadlet/operations/ao-metabase.container }
    - { port: 9090, unit: quadlet/operations/ao-prometheus.container }
  # Host services that publish no container port.
  host_services:
    - { port: 3300, unit: scripts/operations/mastodon-local-proxy.py }
    - { port: 8080, unit: domoticz (host service, -wwwbind 127.0.0.1) }

services:
  # --- ao-sales: Mastodon ------------------------------------------------
  - name: Mastodon local proxy
    url: http://127.0.0.1:3300/
    expect_status: [200]
    expect_title: Mastodon
    expect_body: mastodon.300x3.com
    # A first navigation renders the whole Rails app plus its language list and
    # can exceed the default budget, so this one is given a longer window and
    # allowed to settle on "load" rather than "domcontentloaded". The service
    # was serving 200 to curl throughout; the earlier 15s timeout was the
    # harness being impatient, not a fault in the proxy.
    nav_timeout_ms: 60000
    wait_until: load
    note: >-
      Loopback reverse proxy onto :3000. This, not :3000, is the reachable
      entry point for the Mastodon UI: mastodon-web sets RAILS_FORCE_SSL=true
      and answers :3000 with "301 -> https://127.0.0.1:3000/", but no TLS
      listener exists there, so https://127.0.0.1:3000/ fails to connect
      (verified STATUS=000). The proxy injects X-Forwarded-Proto: https so
      Rails serves content over plain HTTP. See
      scripts/operations/mastodon-local-proxy.py.

  - name: Mastodon web origin (transport only)
    url: http://127.0.0.1:3000/
    expect_status: [301]
    expect_location: "https://127.0.0.1:3000/"
    expect_title: null
    expect_body: null
    # Checked with a non-following transport probe, not the browser. A browser
    # cannot assert this: it follows the 301 to https://127.0.0.1:3000/ and dies
    # with net::ERR_SSL_PROTOCOL_ERROR, because RAILS_FORCE_SSL=true publishes a
    # redirect to a TLS endpoint that has no listener. Asserting 301 in a
    # browser check was guaranteed to fail against correct configuration, so
    # this entry is excluded from the browser run and probed separately below.
    browser_skip: true

  - name: Mastodon streaming
    url: http://127.0.0.1:4000/
    expect_status: [400]
    expect_title: null
    expect_body: Unknown channel requested
    note: >-
      A bare / is not a valid stream channel, so a 400 carrying this exact
      JSON is the correct, healthy response. It proves the listener is alive
      and speaking the streaming protocol rather than failing at the
      transport layer.

  # --- ao-operations ----------------------------------------------------
  - name: Grafana
    url: http://127.0.0.1:3001/
    expect_status: [200]
    expect_landing_path: /login
    expect_title: Grafana
    expect_body: null
    note: >-
      The root issues "302 -> /login" for an unauthenticated request, which
      curl shows directly. A browser FOLLOWS that redirect, so the status
      observed after navigation is 200 and the landing URL is /login. Both are
      asserted: 200 alone would pass on any Grafana page, so expect_landing_path
      is what actually proves the unauthenticated redirect happened.

  - name: Metabase
    url: http://127.0.0.1:3002/
    expect_status: [200]
    expect_title: Metabase
    expect_body: null
    note: >-
      Serves its login surface on the host, superseding the earlier
      "not serving" finding that described a different, undeployed container.

  - name: Prometheus
    url: http://127.0.0.1:9090/
    expect_status: [200]
    expect_landing_path: /query
    expect_title: Prometheus
    expect_body: null
    note: >-
      Root issues "302 -> /query" and the browser follows it, so 200 on /query
      is what a rendered navigation observes. Asserted with the landing path so
      a plain 200 on some other page cannot pass.

  # --- host services ----------------------------------------------------
  - name: Domoticz
    url: http://127.0.0.1:8080/
    expect_status: [200]
    expect_title: Domoticz
    expect_body: null
    note: >-
      Not an ao-* service. Started with -wwwbind 127.0.0.1 -nomdns, so it is
      loopback-only by operator decision and the LAN address must refuse.

  # --- correctly not reachable over loopback ----------------------------
  - name: WebODM web UI
    url: http://127.0.0.1:8000/
    verifiable: false
    reason: >-
      No host listener exists and that is correct. ao-webodm-webapp publishes
      no port: its ports column is empty and podman reports nothing bound on
      the host. The service was confirmed HEALTHY on 2026-10-01 by probing it
      from inside the ao-mapping network instead: ao-webodm-webapp sits at
      10.89.3.18 and answers HTTP 302 when reached from ao-nodeodm on the same
      network. So the application is up and serving; it is simply not exposed
      to the host, and operator access is an SSH tunnel to the container.
      Opening a loopback listener needs separate operator approval, so this
      stays unverifiable from the host by design rather than being opened up
      to make a test pass.

  - name: MeshChatX local UI
    url: https://127.0.0.1:18000/
    expect_status: [200]
    expect_title: Reticulum MeshChatX
    expect_body: null
    # Promoted from unverifiable to verified. An earlier pass recorded this as
    # "not an HTTP service in the sense this check tests", which was a guess:
    # probing it over https:// returns 200 with the title "Reticulum
    # MeshChatX". The context is created with ignoreHTTPSErrors because the
    # backend presents a self-signed certificate on loopback, which is
    # expected for a local-only listener and is not a fault.
    note: >-
      Native MeshChatX backend, loopback only, serving its local web UI over
      HTTPS with a self-signed certificate. Bind to loopback is the intended
      configuration; this listener must not become reachable from the LAN.

  # --- additional loopback web services found by port sweep -------------
  # Discovered by sweeping every listening TCP port on the host and probing
  # each for HTTP, rather than by assuming the Quadlet list was exhaustive.
  # All four are loopback-bound. Ports that answer TCP but not HTTP are not
  # listed: 4242 is a Reticulum protocol listener, 5760 is MAVLink, 5432/
  # 15432/15433 are PostgreSQL, 6379 is Redis, and 20241/25463/41343/45819
  # are cloudflared and agent control ports. Those are verified by their own
  # means, not by a browser.

  - name: OpenClaw Control
    url: http://127.0.0.1:18789/
    expect_status: [200]
    expect_title: OpenClaw Control
    expect_body: null
    note: >-
      Gateway control UI served by the OpenClaw node process on loopback.

  - name: CUPS
    url: http://127.0.0.1:631/
    expect_status: [200]
    expect_title: CUPS
    expect_body: null
    note: >-
      Host print service. Loopback-bound, so the printers are administered
      from this machine only. Not an ao-* service.

  - name: OpenClaw chat relay
    url: http://127.0.0.1:18790/
    expect_status: [404]
    expect_title: null
    expect_body: null
    note: >-
      scripts/openclaw/chat-relay.py. A bare / is not a relay endpoint, so 404
      is the correct answer and proves the listener is alive. The relay is
      reached through the Cloudflare Tunnel hostname, not this port directly.

  # --- operator console: not a deployed service, run on demand -----------
  - name: ALWAYS ON operator console
    url: http://127.0.0.1:8099/
    expect_status: [200]
    expect_title: ALWAYS ON console
    expect_body: "loopback operator console"
    # NOT currently running. scripts/operations/web-console-server.py has no
    # systemd unit, no Quadlet unit, and no timer, so nothing starts it at
    # boot; it is launched by hand when the operator wants it. The archived
    # topology inventory recorded 127.0.0.1:8099 as a python3 listener, so it
    # has run before. start_with_check starts it for the duration of this run
    # and stops it afterwards, leaving no stray process.
    start_with_check:
      command: python3 scripts/operations/web-console-server.py 8099
      cwd: /ALWAYSON
      stop_after: true
    note: >-
      Loopback-only operator web console written by hand, not deployed as a
      service. Three routes: "/" this index, "/sim" the ROS 2 / Gazebo /
      Foxglove console page, and "/podman" a live Podman and systemd status
      view. It is the operator-facing front end for the simulation stack, and
      it is the only thing on the host that presents Foxglove.

  - name: ALWAYS ON console - Foxglove / Gazebo page
    url: http://127.0.0.1:8099/sim
    expect_status: [200]
    expect_title: "ALWAYS ON sim console"
    expect_body: "127.0.0.1:8765"
    start_with_check:
      command: python3 scripts/operations/web-console-server.py 8099
      cwd: /ALWAYSON
      stop_after: true
    note: >-
      The Gazebo and Foxglove view. The page itself is served fine, but it
      connects to ws://127.0.0.1:8765. NOTE that port is NOT the foxglove
      bridge: it is the Gazebo portal container, checked separately below. The
      page renders and names its endpoint either way, but the live Foxglove
      bridge is not reachable at that address, so this check proves the console
      page itself, not a ROS 2 or Foxglove data link.

  # --- Gazebo world portal (the section 10.2 HTML portal) -----------------
  - name: Gazebo factory world portal
    url: http://127.0.0.1:8765/
    expect_status: [200]
    expect_title: "ALWAYSON — Gazebo factory.world portal"
    expect_body: "factory.world"
    note: >-
      Served by the running container "gazebo-portal", published as
      127.0.0.1:8765->80/tcp. This is the browser HTML portal that ES.1 and
      section 10.2.1 require for the fabrication and facility simulation, and
      it is that requirement being met: the portal documents the world at
      /ALWAYSON/GAZEBO/worlds/factory.world, lists the four SketchUp mesh
      exports with their poses, and serves the world and model SDF for
      inspection.

      It is an index and launch surface, not a 3D viewer. The portal says so
      itself: a browser cannot render a .world file, and the world must be
      opened in Gazebo Sim. The portal's own validation table records
      "gz sdf --check factory.world" as PASS and the headless server load as
      NOT RUN because no gz-sim-server binary is installed on this host.

      CORRECTION: config/platform/topology-model.yaml and
      config/platform/version-matrix.yaml both describe 127.0.0.1:8765 as
      foxglove_bridge. That is wrong. The port is held by the gazebo-portal
      container serving HTTP, and foxglove_bridge is not listening. Those two
      files are noted for correction; they were not edited here because that
      is a separate change to recorded configuration.
