# ALWAYS ON - Alertmanager configuration (README 17.2, OPS-11).
# Created 2026-10-21.
#
# Alerting component: Alertmanager (prometheus/alertmanager)
# Routing targets per severity (placeholders pending operator confirmation):
#   critical -> operator KDE Wallet notification + log file
#   warning  -> log file only
#   info     -> log file only
#
# Thresholds per rule are defined in alwayson-alerts.yml (README 17.2).
#
# Operator decision needed: confirm routing targets (email, Slack, pager, etc.)
# before enabling in production. §4.1 rule 12 applies to new package installs.

global:
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alerts@alwayson.local'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'operator-critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'operator-warning'
      repeat_interval: 4h
    - match:
        severity: info
      receiver: 'null-receiver'

receivers:
  - name: 'null-receiver'
  - name: 'operator-critical'
    email_configs:
      - to: 'operator@alwayson.local'
        from: 'alerts@alwayson.local'
        smarthost: 'localhost:25'
        require_tls: false
    webhook_configs:
      - url: 'http://127.0.0.1:9093/api/v1/alerts'
        send_resolved: true
  - name: 'operator-warning'
    email_configs:
      - to: 'operator@alwayson.local'
        from: 'alerts@alwayson.local'
        smarthost: 'localhost:25'
        require_tls: false
    webhook_configs:
      - url: 'http://127.0.0.1:9093/api/v1/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'instance']