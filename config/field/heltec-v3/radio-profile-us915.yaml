# Heltec WiFi LoRa 32 V3 - PEOPLE-RADIO desktop gateway profile
# Distinct from DRONE-RADIO: own frequency (915 MHz), own sync word (0x34),
# own key ID, own device identity. 125 kHz / SF7 per §9.2.2.
radio_profile:
  region: US915
  frequency_mhz: 915
  frequency_plan: "US915 hybrid-channel raw LoRa (NOT LoRaWAN)"
  bandwidth_khz: 125
  spreading_factor: 7
  coding_rate: "4/5"
  preamble_length: 8
  tx_power_dbm: 20
  sync_word: 0x34
  packet_framing: "length-prefixed CRC16 frames"
  max_packet_bytes: 222
  encryption_key_id: "people-radio-key-v1"
  device_identity: "people-radio-device-v1"
  sx1262_mac: "RECORD_FROM_HARDWARE"
  replay_protection: "monotonic sequence numbers, 24h window"
  ack_policy: "selective-repeat, 3 retries"
  retry_backoff_ms: [500, 1500, 4500]
  airtime_limit_pct: 10
